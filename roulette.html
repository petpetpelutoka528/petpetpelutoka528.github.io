<style>
:root{--bg:#F2F5F4;--card:#FFFFFF;--ink:#10201F;--sub:#5B6E6C;--line:#D5DEDC;--hub:#10201F;--hubInk:#F2F5F4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10201F;--card:#182E2C;--ink:#F2F5F4;--sub:#9DB3B0;--line:#2A4542;--hub:#F2F5F4;--hubInk:#10201F}}
:root[data-theme="dark"]{--bg:#10201F;--card:#182E2C;--ink:#F2F5F4;--sub:#9DB3B0;--line:#2A4542;--hub:#F2F5F4;--hubInk:#10201F}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;line-height:1.6}
.wrap{max-width:460px;margin:0 auto;padding:18px 18px 40px}
h1{font-size:30px;font-weight:800;margin:6px 0 2px;letter-spacing:.02em}
.lead{color:var(--sub);margin:0 0 14px;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #3D7BE0;outline-offset:2px}

.stage{position:relative;width:100%;max-width:380px;aspect-ratio:1;margin:8px auto 0}
#wheel{width:100%;height:100%;display:block;border-radius:50%}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--hub);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
.hub{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;border:0;background:var(--hub);color:var(--hubInk);font-weight:800;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hub:disabled{opacity:.85}
.hub:active{transform:scale(.96)}

.result{margin:18px 0 0;min-height:86px;text-align:center}
.result .lbl{font-size:13px;color:var(--sub);margin:0}
.result .what{font-size:28px;font-weight:800;margin:2px 0 0;line-height:1.3}
.result.pop .what{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

.panel{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px 14px}
.panel h2{font-size:16px;margin:10px 0 2px}
.panel p.hint{margin:0 0 6px;color:var(--sub);font-size:13px}
.row{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%}
.row input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:4px 0}
.wt{display:flex;align-items:center;gap:4px}
.wt button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700;line-height:1}
.wt .pct{min-width:40px;text-align:center;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.del{border:0;background:none;color:var(--sub);font-size:18px;width:30px;height:30px}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
.add button{border:0;border-radius:12px;background:var(--hub);color:var(--hubInk);padding:0 16px;font-weight:700}
.foot{display:flex;justify-content:space-between;margin-top:14px}
.link{background:none;border:0;color:var(--sub);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
@media (prefers-reduced-motion: reduce){.result.pop .what{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>なにする？</h1>
  <p class="lead">迷ったら、真ん中を押すだけ。</p>
  <div class="stage">
    <div class="pointer" aria-hidden="true"></div>
    <canvas id="wheel" width="760" height="760" role="img" aria-label="ルーレット"></canvas>
    <button class="hub" id="spin">回す</button>
  </div>
  <div class="result" id="result" aria-live="polite"></div>

  <section class="panel">
    <h2>候補と出やすさ</h2>
    <p class="hint">＋を押すほど出やすくなります。パーセントは今の確率です。</p>
    <div id="list"></div>
    <div class="add"><input id="newName" type="text" maxlength="20" placeholder="候補を追加（例：本屋をぶらぶら）"><button id="addBtn">追加</button></div>
  </section>
  <div class="foot"><button class="link" id="reset">最初の候補に戻す</button><button class="link" id="theme">明るさを切り替える</button></div>
</div>

<script>
(function(){
const COLORS=['#3D7BE0','#F2B33D','#2BA98C','#E2627E','#8A6FD8','#5DB8E8','#F08A3C','#7BC86C','#C76BC2','#4FA3A5'];
const DEFAULTS=[
  {name:'カラオケ2時間',w:3},{name:'スパでお風呂',w:2},{name:'自習室で読書',w:3},
  {name:'みなとみらい散歩',w:3},{name:'カフェで一息',w:2},{name:'まっすぐ帰ってゴロゴロ',w:2}
];
const KEY='nanisuru-items';
let items=load(), rot=0, spinning=false;
const cv=document.getElementById('wheel'), ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function load(){ try{ const v=JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(v)&&v.length) return v; }catch(e){} return DEFAULTS.map(x=>({...x})); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(items)); }catch(e){} }
function total(){ return items.reduce((s,x)=>s+x.w,0); }

function draw(){
  const W=cv.width, c=W/2, r=c-6; ctx.clearRect(0,0,W,W);
  if(!items.length){ ctx.fillStyle='#888'; ctx.beginPath(); ctx.arc(c,c,r,0,Math.PI*2); ctx.fill(); return; }
  const T=total(); let a=-Math.PI/2;
  items.forEach((it,i)=>{
    const sw=it.w/T*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,r,a,a+sw); ctx.closePath();
    ctx.fillStyle=COLORS[i%COLORS.length]; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=4; ctx.stroke();
    // label
    ctx.save(); ctx.translate(c,c); ctx.rotate(a+sw/2);
    ctx.fillStyle='#fff'; ctx.textAlign='right'; ctx.textBaseline='middle';
    const fs = sw<0.35?22:(sw<0.6?26:30);
    ctx.font=`800 ${fs}px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif`;
    let t=it.name; const maxW=r-110;
    while(ctx.measureText(t).width>maxW && t.length>2) t=t.slice(0,-1);
    if(t!==it.name) t=t.slice(0,-1)+'…';
    ctx.shadowColor='rgba(0,0,0,.25)'; ctx.shadowBlur=4;
    ctx.fillText(t,r-24,0); ctx.restore();
    a+=sw;
  });
}
function setRot(deg){ cv.style.transform=`rotate(${deg}deg)`; }

function pick(){
  const T=total(); let x=Math.random()*T;
  for(let i=0;i<items.length;i++){ x-=items[i].w; if(x<0) return i; } return items.length-1;
}
function spin(){
  if(spinning||!items.length) return;
  spinning=true; const btn=document.getElementById('spin'); btn.disabled=true;
  const res=document.getElementById('result'); res.className='result'; res.innerHTML='';
  const i=pick(), T=total();
  let start=0; for(let k=0;k<i;k++) start+=items[k].w/T*360;
  const size=items[i].w/T*360;
  const target=start+size*(0.15+Math.random()*0.7);    // degrees clockwise from top
  const cur=((rot%360)+360)%360;
  let delta=(360-target)-cur; delta=((delta%360)+360)%360;
  const dur=reduce?300:4200;
  rot+= (reduce?0:360*5)+delta;
  cv.style.transition=`transform ${dur}ms cubic-bezier(.15,.85,.2,1)`;
  setRot(rot);
  setTimeout(()=>{
    spinning=false; btn.disabled=false;
    res.innerHTML=`<p class="lbl">今夜はこれ</p><p class="what"></p>`;
    res.querySelector('.what').textContent=items[i].name;
    void res.offsetWidth; res.className='result pop';
    if(navigator.vibrate) navigator.vibrate(30);
  },dur+50);
}

function renderList(){
  const L=document.getElementById('list'); L.innerHTML=''; const T=total();
  items.forEach((it,i)=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>
      <input type="text" maxlength="20" aria-label="候補の名前">
      <span class="wt"><button aria-label="出にくくする">−</button><span class="pct">${Math.round(it.w/T*100)}%</span><button aria-label="出やすくする">＋</button></span>
      <button class="del" aria-label="${''}削除">×</button>`;
    const inp=row.querySelector('input'); inp.value=it.name;
    inp.onchange=()=>{ const v=inp.value.trim(); if(v){ it.name=v; } else inp.value=it.name; save(); draw(); };
    const [minus,plus]=row.querySelectorAll('.wt button');
    minus.disabled = it.w<=1; plus.disabled = it.w>=10;
    minus.onclick=()=>{ if(it.w>1){ it.w--; commit(); } };
    plus.onclick=()=>{ if(it.w<10){ it.w++; commit(); } };
    row.querySelector('.del').onclick=()=>{ if(items.length<=2){ alert('候補は2つ以上残してください'); return; } items.splice(i,1); commit(); };
    L.appendChild(row);
  });
}
function commit(){ save(); draw(); renderList(); }

document.getElementById('spin').onclick=spin;
document.getElementById('addBtn').onclick=()=>{
  const n=document.getElementById('newName'); const v=n.value.trim(); if(!v) return;
  if(items.length>=10){ alert('候補は10個までです'); return; }
  items.push({name:v,w:2}); n.value=''; commit();
};
document.getElementById('newName').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('addBtn').click(); });
document.getElementById('reset').onclick=()=>{ if(confirm('最初の候補に戻しますか？')){ items=DEFAULTS.map(x=>({...x})); commit(); } };
document.getElementById('theme').onclick=()=>{
  const r=document.documentElement; const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.dataset.theme=cur==='dark'?'light':'dark'; try{ localStorage.setItem('nanisuru-theme',r.dataset.theme);}catch(e){}
};
try{ const t=localStorage.getItem('nanisuru-theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
draw(); renderList();
})();
</script>
</body>
